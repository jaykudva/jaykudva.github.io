<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BJAY BCRAWL Dispatch — Rail Control</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='14' fill='%23101010'/><text x='50' y='68' font-size='52' font-family='Helvetica,Arial' font-weight='bold' fill='%23996633' text-anchor='middle'>D</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #996633; /* J·Z brown (variable name kept for laziness) */
      --amber: #FFAA00;
      --green: #00933C;
      --yellow: #FCCC0A;
      --bg: #121212;
      --panel: #1c1c1c;
      --edge: #2e2e2e;
      --text: #e8e8e8;
      --dim: #8a8a8a;
      --helvetica: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--helvetica);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 4rem;
    }
    header {
      background: #000;
      border-bottom: 4px solid var(--orange);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .bullet {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2.4rem; height: 2.4rem; border-radius: 50%;
      background: var(--orange); color: #fff; font-weight: 700; font-size: 1.4rem;
      flex: none;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.01em; }
    header p { font-size: 0.72rem; color: var(--dim); text-transform: uppercase; letter-spacing: 0.14em; margin-top: 0.15rem; }
    main { max-width: 560px; margin: 0 auto; padding: 1.25rem 1rem; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.1rem;
    }
    .panel h2 {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.14em; color: var(--dim); margin-bottom: 0.8rem;
    }
    /* status board */
    .board {
      background: #000;
      border: 2px solid var(--edge);
      border-radius: 8px;
      padding: 0.8rem 1rem;
      font-family: "Doto", monospace;
      font-weight: 900;
      color: var(--amber);
      text-shadow: 0 0 8px rgba(255, 170, 0, 0.5);
    }
    .board .b1 { font-size: 0.85rem; opacity: 0.85; }
    .board .b2 { font-size: 1.3rem; margin-top: 0.25rem; }
    .board .b3 { font-size: 0.65rem; margin-top: 0.5rem; color: #5c4200; text-shadow: none; letter-spacing: 0.1em; }
    /* login */
    input[type="password"], input[type="datetime-local"], textarea {
      width: 100%;
      background: #0d0d0d;
      color: var(--text);
      border: 1px solid var(--edge);
      border-radius: 6px;
      padding: 0.65rem 0.8rem;
      font-family: var(--helvetica);
      font-size: 1rem;
    }
    textarea { min-height: 4.2rem; resize: vertical; }
    input[type="datetime-local"] { color-scheme: dark; }
    button {
      font-family: var(--helvetica);
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      border-radius: 6px;
      padding: 0.65rem 1rem;
      cursor: pointer;
      color: #fff;
      background: #333;
      transition: filter 0.15s, transform 0.05s;
    }
    button:hover { filter: brightness(1.2); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: default; }
    .btn-primary { background: var(--orange); }
    .btn-green { background: var(--green); }
    .btn-caution { background: var(--yellow); color: #000; }
    .btn-ghost { background: transparent; border: 1px solid var(--edge); color: var(--dim); }
    .row { display: flex; gap: 0.6rem; margin-top: 0.7rem; flex-wrap: wrap; }
    /* timeline controls */
    .tl { list-style: none; }
    .tl li {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.45rem 0;
      border-bottom: 1px dashed #262626;
    }
    .tl li:last-child { border-bottom: none; }
    .tl .name { flex: 1; font-size: 0.95rem; }
    .tl .name small { color: var(--dim); display: block; font-size: 0.72rem; }
    .tl button { padding: 0.45rem 0.7rem; font-size: 0.78rem; }
    .tl li.active-at .name { color: var(--green); font-weight: 700; }
    .tl li.active-enroute .name { color: var(--yellow); font-weight: 700; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.6rem; }
    .chips button { font-size: 0.72rem; font-weight: 400; background: #262626; color: #bbb; padding: 0.35rem 0.6rem; border-radius: 999px; }
    .msg { margin-top: 0.7rem; font-size: 0.82rem; min-height: 1.2em; }
    .msg.ok { color: var(--green); }
    .msg.err { color: #ff5f42; }
    .hidden { display: none; }
    footer { text-align: center; font-size: 0.7rem; color: #555; padding-top: 1rem; }
    footer a { color: #777; }
  </style>
</head>
<body>
  <header>
    <span class="bullet">J</span>
    <div>
      <h1>BJAY BCRAWL Dispatch</h1>
      <p>Rail Control Center · authorized personnel only</p>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Current state</h2>
      <div class="board">
        <div class="b1" id="boardPhase">—</div>
        <div class="b2" id="boardStop">CONNECTING…</div>
        <div class="b3" id="boardMeta"></div>
      </div>
    </section>

    <section class="panel" id="loginPanel">
      <h2>Conductor sign-in</h2>
      <input type="password" id="password" placeholder="dispatch passphrase" autocomplete="current-password">
      <div class="row"><button class="btn-primary" id="loginBtn">Sign in</button></div>
      <div class="msg" id="loginMsg"></div>
    </section>

    <section class="panel hidden" id="controlPanel">
      <h2>Train position</h2>
      <ul class="tl" id="timeline"></ul>
      <div class="row">
        <button class="btn-ghost" id="btnYard">↩ Back to yard (not departed)</button>
        <button class="btn-primary" id="btnDone">🎉 Service complete</button>
      </div>
      <div class="msg" id="posMsg"></div>
    </section>

    <section class="panel hidden" id="revealPanel">
      <h2>Station listing</h2>
      <div class="row">
        <button class="btn-primary" id="btnReveal">…</button>
      </div>
      <div class="msg" id="revealMsg"></div>
    </section>

    <section class="panel hidden" id="departurePanel">
      <h2>Departure time (drives the countdown clock)</h2>
      <input type="datetime-local" id="departureInput">
      <div class="row">
        <button class="btn-green" id="btnSetDeparture">Set departure</button>
      </div>
      <div class="msg" id="depMsg"></div>
    </section>

    <section class="panel hidden" id="advisoryPanel">
      <h2>Service advisory</h2>
      <textarea id="advisoryInput" placeholder="e.g. BJAY BCRAWL trains are running 20 min behind schedule due to an unplanned second round."></textarea>
      <div class="chips" id="advisoryChips"></div>
      <div class="row">
        <button class="btn-caution" id="btnPostAdvisory">Post advisory</button>
        <button class="btn-ghost" id="btnClearAdvisory">Clear</button>
      </div>
      <div class="msg" id="advMsg"></div>
    </section>
  </main>

  <footer><a href="index.html">← back to the public board</a></footer>

  <script src="spots.js"></script>
  <script src="admin.js"></script>
</body>
</html>
