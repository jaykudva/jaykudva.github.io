<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Crawl Tour</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Pirata+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #f5f0eb;
      --bg-dark: #2a2620;
      --text-light: #1a1512;
      --text-dark: #e8e3de;
      --container-bg-light: #fdfaf5;
      --container-bg-dark: #3d3630;
      --accent: #a89968;
      --accent-light: #c4b59a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Instrument Serif', serif;
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    .admin-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .admin-panel {
      background: var(--container-bg-dark);
      border: 1px solid rgba(168, 153, 104, 0.1);
      border-radius: 24px;
      padding: 3rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .admin-panel h1 {
      font-family: 'Pirata One', cursive;
      font-size: 2rem;
      color: var(--accent);
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      color: var(--text-dark);
      font-style: italic;
    }

    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid rgba(168, 153, 104, 0.3);
      border-radius: 12px;
      background: rgba(168, 153, 104, 0.05);
      color: var(--text-dark);
      font-family: 'Instrument Serif', serif;
      font-size: 0.95rem;
      transition: all 0.3s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(168, 153, 104, 0.1);
    }

    button {
      width: 100%;
      padding: 0.75rem 1rem;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      color: var(--bg-dark);
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      font-family: 'Instrument Serif', serif;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(168, 153, 104, 0.3);
    }

    .hidden {
      display: none;
    }

    .status {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
      font-size: 0.9rem;
    }

    .status.success {
      background: rgba(76, 175, 80, 0.15);
      color: #4CAF50;
    }

    .status.error {
      background: rgba(244, 67, 54, 0.15);
      color: #F44336;
    }

    @media (max-width: 480px) {
      .admin-panel {
        padding: 2rem 1.5rem;
      }

      .form-group > div[style*="display: flex"] {
        gap: 0.5rem !important;
        flex-wrap: wrap;
      }

      .form-group label[style*="display: flex"] {
        flex: 1;
        min-width: 100px;
        margin-bottom: 0.5rem !important;
      }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-panel">
      <h1>Admin Control</h1>

      <!-- Password Form -->
      <div id="passwordForm">
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter admin password">
        </div>
        <button onclick="checkPassword()">Login</button>
        <div id="passwordStatus" class="status hidden"></div>
      </div>

      <!-- Location Form (hidden until password correct) -->
      <div id="locationForm" class="hidden">
        <div class="form-group">
          <label for="location">Location</label>
          <select id="location">
            <option value="">-- Select a place --</option>
          </select>
        </div>

        <div class="form-group">
          <label>Status</label>
          <div style="display: flex; gap: 1rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; margin: 0; font-weight: normal;">
              <input type="radio" name="status" value="headed" id="statusHeaded"> Headed to
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; margin: 0; font-weight: normal;">
              <input type="radio" name="status" value="at" id="statusAt" checked> At
            </label>
          </div>
        </div>

        <button onclick="updateLocation()">Update</button>
        <button onclick="clearLocation()" style="margin-top: 0.5rem; background: rgba(168, 153, 104, 0.3); opacity: 0.8;">Clear</button>
        <button onclick="logout()" style="margin-top: 0.5rem; opacity: 0.6;">Logout</button>
        <div id="locationStatus" class="status hidden"></div>

        <!-- Roster Management -->
        <div class="form-group" style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid rgba(168, 153, 104, 0.2);">
          <label for="rosterPerson">Add to Roster</label>
          <select id="rosterPerson">
            <option value="">-- Select a person --</option>
          </select>
        </div>
        <button onclick="addRosterPerson()" style="margin-bottom: 1rem;">Add Person</button>

        <div class="form-group">
          <label style="margin-bottom: 1rem;">Current Attendees</label>
          <div id="currentAttendees" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
        </div>

        <div class="form-group" style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(168, 153, 104, 0.2);">
          <label style="margin-bottom: 1rem;">Previous Participants</label>
          <div id="previousAttendees" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
        </div>
        <div id="rosterStatus" class="status hidden"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="spots.js"></script>
  <script src="roster.js"></script>

  <script>
    // Set admin password (change this to your desired password)
    const ADMIN_PASSWORD = "changeme";

    const firebaseConfig = {
      apiKey: "AIzaSyAaIy5lKdohbQK182-XMj-yEkZa9bINwlw",
      authDomain: "crawl-tour.firebaseapp.com",
      databaseURL: "https://crawl-tour-default-rtdb.firebaseio.com",
      projectId: "crawl-tour",
      storageBucket: "crawl-tour.firebasestorage.app",
      messagingSenderId: "712986877186",
      appId: "1:712986877186:web:f8bdc89908431103ed761b",
      measurementId: "G-Z4SQZ1QC89"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function hashPassword(pwd) {
      let hash = 0;
      for (let i = 0; i < pwd.length; i++) {
        const char = pwd.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return hash.toString();
    }

    function checkPassword() {
      const password = document.getElementById('password').value;
      const statusEl = document.getElementById('passwordStatus');

      if (hashPassword(password) === hashPassword(ADMIN_PASSWORD)) {
        document.getElementById('passwordForm').classList.add('hidden');
        document.getElementById('locationForm').classList.remove('hidden');
        populateLocations();
        populateRoster();
      } else {
        statusEl.textContent = 'Incorrect password';
        statusEl.className = 'status error';
        statusEl.classList.remove('hidden');
      }
    }

    function populateLocations() {
      const select = document.getElementById('location');
      CRAWL_SPOTS.forEach((spot, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${index + 1}. ${spot.name}`;
        select.appendChild(option);
      });
    }

    function populateRoster() {
      const select = document.getElementById('rosterPerson');
      ROSTER.forEach(person => {
        const option = document.createElement('option');
        option.value = person.name;
        option.textContent = person.name;
        select.appendChild(option);
      });
      renderCurrentAttendees();
    }

    function addRosterPerson() {
      const personName = document.getElementById('rosterPerson').value;
      const statusEl = document.getElementById('rosterStatus');

      if (!personName) {
        statusEl.textContent = 'Please select a person';
        statusEl.className = 'status error';
        statusEl.classList.remove('hidden');
        return;
      }

      database.ref('roster').once('value', (snapshot) => {
        const roster = snapshot.val() || { currentParticipants: [], previousParticipants: [] };
        const current = roster.currentParticipants || [];

        if (!current.includes(personName)) {
          current.push(personName);
          database.ref('roster/currentParticipants').set(current).then(() => {
            statusEl.textContent = `${personName} added!`;
            statusEl.className = 'status success';
            statusEl.classList.remove('hidden');
            document.getElementById('rosterPerson').value = '';
            renderCurrentAttendees();
          }).catch(error => {
            statusEl.textContent = 'Error: ' + error.message;
            statusEl.className = 'status error';
            statusEl.classList.remove('hidden');
          });
        } else {
          statusEl.textContent = personName + ' is already here!';
          statusEl.className = 'status error';
          statusEl.classList.remove('hidden');
        }
      });
    }

    function removeRosterPerson(personName) {
      const statusEl = document.getElementById('rosterStatus');

      database.ref('roster').once('value', (snapshot) => {
        const roster = snapshot.val() || { currentParticipants: [], previousParticipants: [] };
        let current = roster.currentParticipants || [];
        let previous = roster.previousParticipants || [];

        // Remove from current
        current = current.filter(p => p !== personName);

        // Add to previous if not already there
        if (!previous.includes(personName)) {
          previous.push(personName);
        }

        database.ref('roster').set({
          currentParticipants: current,
          previousParticipants: previous
        }).then(() => {
          statusEl.textContent = `${personName} moved to previous participants`;
          statusEl.className = 'status success';
          statusEl.classList.remove('hidden');
          renderCurrentAttendees();
        }).catch(error => {
          statusEl.textContent = 'Error: ' + error.message;
          statusEl.className = 'status error';
          statusEl.classList.remove('hidden');
        });
      });
    }

    function renderCurrentAttendees() {
      const container = document.getElementById('currentAttendees');
      database.ref('roster/currentParticipants').once('value', (snapshot) => {
        const current = snapshot.val() || [];
        container.innerHTML = '';

        if (current.length === 0) {
          container.innerHTML = '<div style="opacity: 0.6;">nobody here yet</div>';
          return;
        }

        current.forEach(name => {
          const btn = document.createElement('button');
          btn.textContent = `✕ ${name}`;
          btn.style.background = 'rgba(168, 153, 104, 0.1)';
          btn.style.marginBottom = '0.5rem';
          btn.onclick = () => removeRosterPerson(name);
          container.appendChild(btn);
        });
      });

      renderPreviousAttendees();
    }

    function renderPreviousAttendees() {
      const container = document.getElementById('previousAttendees');
      database.ref('roster/previousParticipants').once('value', (snapshot) => {
        const previous = snapshot.val() || [];
        container.innerHTML = '';

        if (previous.length === 0) {
          container.innerHTML = '<div style="opacity: 0.6;">nobody yet</div>';
          return;
        }

        previous.forEach(name => {
          const btn = document.createElement('button');
          btn.textContent = `🗑️ ${name}`;
          btn.style.background = 'rgba(244, 67, 54, 0.15)';
          btn.style.color = '#F44336';
          btn.style.marginBottom = '0.5rem';
          btn.onclick = () => deletePreviousParticipant(name);
          container.appendChild(btn);
        });
      });
    }

    function deletePreviousParticipant(personName) {
      const statusEl = document.getElementById('rosterStatus');

      database.ref('roster').once('value', (snapshot) => {
        const roster = snapshot.val() || { currentParticipants: [], previousParticipants: [] };
        let previous = roster.previousParticipants || [];

        previous = previous.filter(p => p !== personName);

        database.ref('roster/previousParticipants').set(previous).then(() => {
          statusEl.textContent = `${personName} completely removed`;
          statusEl.className = 'status success';
          statusEl.classList.remove('hidden');
          renderPreviousAttendees();
        }).catch(error => {
          statusEl.textContent = 'Error: ' + error.message;
          statusEl.className = 'status error';
          statusEl.classList.remove('hidden');
        });
      });
    }

    function updateLocation() {
      const locationIndex = document.getElementById('location').value;
      const statusType = document.querySelector('input[name="status"]:checked').value;
      const statusEl = document.getElementById('locationStatus');

      if (!locationIndex) {
        statusEl.textContent = 'Please select a location';
        statusEl.className = 'status error';
        statusEl.classList.remove('hidden');
        return;
      }

      const spot = CRAWL_SPOTS[locationIndex];
      database.ref('currentLocation').set({
        index: parseInt(locationIndex),
        name: spot.name,
        status: statusType,
        timestamp: new Date().toISOString()
      }).then(() => {
        const statusText = statusType === 'headed' ? `Headed to: ${spot.name}` : `At: ${spot.name}`;
        statusEl.textContent = `Updated - ${statusText}`;
        statusEl.className = 'status success';
        statusEl.classList.remove('hidden');
      }).catch(error => {
        statusEl.textContent = 'Error updating: ' + error.message;
        statusEl.className = 'status error';
        statusEl.classList.remove('hidden');
      });
    }

    function clearLocation() {
      const statusEl = document.getElementById('locationStatus');
      database.ref('currentLocation').remove().then(() => {
        statusEl.textContent = 'Status cleared';
        statusEl.className = 'status success';
        statusEl.classList.remove('hidden');
      }).catch(error => {
        statusEl.textContent = 'Error clearing: ' + error.message;
        statusEl.className = 'status error';
        statusEl.classList.remove('hidden');
      });
    }

    function logout() {
      document.getElementById('passwordForm').classList.remove('hidden');
      document.getElementById('locationForm').classList.add('hidden');
      document.getElementById('password').value = '';
      document.getElementById('location').value = '';
      document.getElementById('passwordStatus').classList.add('hidden');
      document.getElementById('locationStatus').classList.add('hidden');
    }

    // Allow Enter key to submit password
    document.getElementById('password').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkPassword();
    });

    document.getElementById('location').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') updateLocation();
    });
  </script>
</body>
</html>
